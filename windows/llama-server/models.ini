; llama-server router presets for Open Notebook.
;
; One section per model. The section name is the model name that Open Notebook
; must use when it calls the server. Keys are llama-server command-line flags
; without the leading dashes (see llama.cpp tools/server/README.md, "Model
; presets"). [*] holds defaults applied to every model.
;
; Started by start-llama-server.ps1 in this folder.

[*]
n-gpu-layers = 999
flash-attn = on

; Chat / transformation / tools / large-context slot.
; Gemma 4 26B-A4B, Google's quantization-aware-trained 4-bit checkpoint in
; Unsloth's dynamic GGUF conversion (14.25 GB). Thinking mode is turned off
; server-side because Open Notebook cannot pass that setting itself.
; Sampling values are Google's recommended settings for Gemma 4.
; 65536 tokens of context keeps the model plus its KV cache near 16 GB so
; the embedder below fits beside it on the 24 GB card.
[gemma-4-26b-a4b]
model = S:/RAG Notebooks/llama-server/models/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
load-on-startup = true
ctx-size = 65536
cache-type-k = q8_0
cache-type-v = q8_0
jinja = true
chat-template-kwargs = {"enable_thinking":false}
temp = 1.0
top-p = 0.95
top-k = 64
cache-reuse = 256

; Embedding slot. Qwen3-Embedding-4B at 8-bit (4.28 GB), 2560-dimension
; vectors, 32K max input. Flags are from Qwen's model card for llama.cpp,
; except the context/batch size: Qwen's card uses 8192, which cost about
; 6.4 GB of VRAM here and left under 1 GB free beside Gemma. Open Notebook
; embeds chunks of about 400 tokens (its default) and short queries, so 2048
; is plenty and keeps the footprint small. Raise it if OPEN_NOTEBOOK_CHUNK_SIZE
; is ever set above ~1500.
; Loaded on first use (source ingestion or search), not at startup.
[qwen3-embedding-4b]
model = S:/RAG Notebooks/llama-server/models/Qwen3-Embedding-4B-Q8_0.gguf
load-on-startup = false
embeddings = true
pooling = last
ctx-size = 2048
batch-size = 2048
ubatch-size = 2048
